[project]
name = "primitive-db"
version = "0.2.0"
description = "Консольное приложение, имитирующее работу с примитивной базой данных"
readme = "README.md"
authors = [
    { name = "Yurii Kupriianov", email = "yyrarw@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
