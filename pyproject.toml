[project]
name = "primitive-db"
version = "0.1.0"
description = "Консольное приложение, имитирующее работу с примитивной базой данных"
readme = "README.md"
authors = [
    { name = "Yurii Kupriianov", email = "yyrarw@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
